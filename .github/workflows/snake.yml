name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # запускается раз в сутки в 00:00 UTC
  push:
    branches:
      - main              # запускается при пуше в main (поменяй на master, если у тебя так)
  workflow_dispatch:        # позволяет запустить вручную из вкладки Actions

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: thealiyevazim
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
